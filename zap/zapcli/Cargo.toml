[workspace]
members = ["app", "every_page_ever", "app_core"]
resolver = "2"
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
image = { version = "0.25", default-features = false, features = ["png"] }
